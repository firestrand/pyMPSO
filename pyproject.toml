[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pso-framework"
version = "0.1.0"
description = "A modular, extensible Particle Swarm Optimization framework"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "PSO Framework Contributors"},
]
license = "MIT"
dependencies = [
    "numpy>=2.5.3",
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
parallel = [
    "ray>=2.59.0",
]

[project.scripts]
pso-run = "src.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
quality = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.uv]
default-groups = ["dev", "quality"]

[tool.setuptools]
package-dir = {"" = "."}
packages.find = {where = ["."], include = ["src*"]}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests",
    "slow: Slow tests that take more than 5 seconds",
    "benchmark: Performance benchmark tests",
    "smoke: Quick smoke tests for basic functionality",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".git", "__pycache__", ".venv", "build", "dist", "archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

[tool.ty.src]
include = ["src", "tests"]
