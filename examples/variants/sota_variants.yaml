# SOTA-oriented PSO variant presets (config-first, composable modules).
#
# This file captures the algorithm families currently present in the codebase
# as named variant overrides. The goal is to make each variant buildable from
# configuration alone.
#
# Notes:
# - Only a subset is fully vectorized today; unsupported combinations are still
#   intentionally retained as first-class configuration intents.
# - The integration variant test asserts this contract by checking that unsupported
#   entries fail with the explicit vectorization error.

problems_to_benchmark:
  sphere:
    dimensions: 20
    bounds:
      min: -100.0
      max: 100.0
    stopping_criteria:
    - {type: max_iterations, max_iterations: 2500}

  rastrigin:
    dimensions: 10
    bounds:
      min: -5.12
      max: 5.12
    stopping_criteria:
    - {type: max_iterations, max_iterations: 2500}

common_swarm:
  num_particles: 40

common_pso_params:
  topology: global
  initialization_strategy: random_uniform
  velocity_strategy: standard
  boundary_handler: clamping
  influence_strategy: single_best

  velocity_strategy_params:
    c1: 1.49445
    c2: 1.49445
common_run_config:
  num_runs: 1
  verbose: false

pso_variants:
  default: {}

  standard_global:
    pso_params:
      topology: global

  standard_ring:
    pso_params:
      topology: ring
      topology_params:
        k: 3

  standard_random:
    pso_params:
      topology: random
      topology_params:
        k: 4
        rebuild_probability: 0.7

  qpso:
    pso_params:
      velocity_strategy: qpso
      velocity_strategy_params:
        beta: 1.0

  apso:
    pso_params:
      velocity_strategy: apso
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  qpso_decay:
    pso_params:
      velocity_strategy: qpso
      velocity_strategy_params:
        beta_min: 1.2
        beta_max: 2.0

  qpsp:
    pso_params:
      velocity_strategy: qpso
      topology: random
      topology_params:
        k: 3
        rebuild_probability: 0.8
      velocity_strategy_params:
        beta_min: 1.3
        beta_max: 2.2

  qpsb:
    pso_params:
      velocity_strategy: qpso
      topology: ring
      topology_params:
        k: 4
      velocity_strategy_params:
        beta: 1.8

  apso_gbest:
    pso_params:
      velocity_strategy: apso
      topology: global
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_lbest:
    pso_params:
      velocity_strategy: apso
      topology: ring
      topology_params:
        k: 3
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_stable:
    pso_params:
      velocity_strategy: apso
      velocity_strategy_params:
        w_max: 0.8
        w_min: 0.4
        c1_max: 2.0
        c1_min: 0.7
        c2_max: 2.0
        c2_min: 0.7

  apso_aggressive:
    pso_params:
      velocity_strategy: apso
      topology: random
      topology_params:
        k: 4
        rebuild_probability: 0.8
      velocity_strategy_params:
        w_max: 1.0
        w_min: 0.2
        c1_max: 3.0
        c1_min: 0.2
        c2_max: 3.0
        c2_min: 0.2

  apso_global_sparse:
    pso_params:
      velocity_strategy: apso
      topology: global
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_global_dense:
    pso_params:
      velocity_strategy: apso
      topology: global
      velocity_strategy_params:
        w_max: 1.0
        w_min: 0.3
        c1_max: 3.0
        c1_min: 0.0
        c2_max: 3.0
        c2_min: 0.0

  apso_lbest_sparse:
    pso_params:
      velocity_strategy: apso
      topology: ring
      topology_params:
        k: 2
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_lbest_dense:
    pso_params:
      velocity_strategy: apso
      topology: ring
      topology_params:
        k: 8
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_random_sparse:
    pso_params:
      velocity_strategy: apso
      topology: random
      topology_params:
        k: 2
        rebuild_probability: 0.3
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_random_dense:
    pso_params:
      velocity_strategy: apso
      topology: random
      topology_params:
        k: 6
        rebuild_probability: 1.0
      velocity_strategy_params:
        w_max: 1.0
        w_min: 0.2
        c1_max: 3.0
        c1_min: 0.2
        c2_max: 3.0
        c2_min: 0.2

  inertia_weight:
    pso_params:
      velocity_strategy: inertia_weight
      velocity_strategy_params:
        w: 0.9
        c1: 2.0
        c2: 2.0

  constriction:
    pso_params:
      velocity_strategy: constriction
      topology: global
      velocity_strategy_params:
        phi1: 2.05
        phi2: 2.05
  constriction_random_topology:
    pso_params:
      velocity_strategy: constriction
      topology: random
      topology_params:
        k: 3
        rebuild_probability: 0.5
      velocity_strategy_params:
        phi1: 2.05
        phi2: 2.05
  hypersphere_spso2011:
    pso_params:
      topology: random
      topology_params:
        k: 3
      velocity_strategy: hypersphere
      boundary_handler: damped_reflection
      initialization_strategy: bounds_aware

      boundary_handler_params:
        damping_factor: -0.5
  fips_global:
    pso_params:
      velocity_strategy: fips
      influence_strategy: fips
      velocity_strategy_params:
        use_personal_best: true
        phi: 4.1

  fips_ring:
    pso_params:
      velocity_strategy: fips
      influence_strategy: fips
      topology: ring
      topology_params:
        k: 3
      velocity_strategy_params:
        use_personal_best: true
        phi: 4.1

  bare_bones:
    pso_params:
      velocity_strategy: bare_bones
      influence_strategy: single_best
      velocity_strategy_params:
        use_abs_std: true
        min_std: 1e-6

  orthogonal_learning:
    pso_params:
      influence_strategy: orthogonal_learning

  orthogonal_mutation:
    pso_params:
      velocity_strategy: orthogonal_mutation
      velocity_strategy_params:
        mutation_probability: 0.2
        mutation_strength: 0.03
        mutation_axes: 4

  de_hybrid:
    pso_params:
      velocity_strategy: de_hybrid
      velocity_strategy_params:
        differential_weight: 0.7
        crossover_probability: 0.85

  clpso:
    pso_params:
      velocity_strategy: clpso
      velocity_strategy_params:
        c: 1.49445
        w_start: 0.9
        w_end: 0.4
        refresh_gap: 7

  clpso_ring:
    pso_params:
      topology: ring
      topology_params:
        k: 2
      velocity_strategy: clpso
      velocity_strategy_params:
        c: 1.49445
        w_start: 0.9
        w_end: 0.4
        refresh_gap: 7

  clamping_position_alias:
    pso_params:
      boundary_handler: position_clamping

  bounds_aware_init:
    pso_params:
      initialization_strategy: bounds_aware
