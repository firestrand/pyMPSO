# Canonical PSO variant matrix for core family-level comparisons.

problems_to_benchmark:
  sphere:
    dimensions: 20
    bounds:
      min: -100.0
      max: 100.0
    stopping_criteria:
    - {type: max_iterations, max_iterations: 2500}

  rastrigin:
    dimensions: 10
    bounds:
      min: -5.12
      max: 5.12
    stopping_criteria:
    - {type: max_iterations, max_iterations: 2500}

common_swarm:
  num_particles: 40

common_pso_params:
  topology: global
  initialization_strategy: random_uniform
  velocity_strategy: standard
  boundary_handler: clamping
  influence_strategy: single_best

  velocity_strategy_params:
    c1: 1.49445
    c2: 1.49445
common_run_config:
  num_runs: 3
  verbose: false

pso_variants:
  default: {}

  standard_ring:
    pso_params:
      topology: ring
      topology_params:
        k: 2

  standard_random:
    pso_params:
      topology: random
      topology_params:
        k: 3
        rebuild_probability: 1.0

  inertia_weight:
    pso_params:
      velocity_strategy: inertia_weight
      velocity_strategy_params: {}
  constriction:
    pso_params:
      velocity_strategy: constriction
      topology: random
      topology_params:
        k: 3
        rebuild_probability: 0.2
      velocity_strategy_params:
        phi1: 2.05
        phi2: 2.05
  qpso:
    pso_params:
      velocity_strategy: qpso
      velocity_strategy_params:
        beta: 1.0

  apso:
    pso_params:
      velocity_strategy: apso
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  hypersphere_spso2011:
    pso_params:
      topology: random
      topology_params:
        k: 3
      velocity_strategy: hypersphere
      boundary_handler: damped_reflection
      initialization_strategy: bounds_aware

      boundary_handler_params:
        damping_factor: -0.5
  fips_global:
    pso_params:
      velocity_strategy: fips
      influence_strategy: fips
      topology: global

  bare_bones:
    pso_params:
      velocity_strategy: bare_bones
      topology: global
      influence_strategy: single_best

  clpso:
    pso_params:
      velocity_strategy: clpso
      topology: global
      influence_strategy: single_best
      velocity_strategy_params:
        c: 1.49445
        w_start: 0.9
        w_end: 0.4
        refresh_gap: 7
