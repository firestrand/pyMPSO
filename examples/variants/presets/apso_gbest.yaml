problems_to_benchmark:
  sphere:
    dimensions: 20
    bounds:
      min: -100.0
      max: 100.0
    stopping_criteria:
    - type: max_iterations
      max_iterations: 2500
  rastrigin:
    dimensions: 10
    bounds:
      min: -5.12
      max: 5.12
    stopping_criteria:
    - type: max_iterations
      max_iterations: 2500
common_swarm:
  num_particles: 40
common_pso_params:
  topology: global
  initialization_strategy: random_uniform
  velocity_strategy: standard
  boundary_handler: clamping
  influence_strategy: single_best
  velocity_strategy_params:
    c1: 1.49445
    c2: 1.49445
common_run_config:
  num_runs: 1
  verbose: false
pso_variants:
  default: {}
  apso_gbest:
    pso_params:
      velocity_strategy: apso
      topology: global
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5
