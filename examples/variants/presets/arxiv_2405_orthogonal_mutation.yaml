problems_to_benchmark:
  sphere:
    dimensions: 20
    bounds:
      min: -100.0
      max: 100.0
    stopping_criteria:
    - type: max_iterations
      max_iterations: 2500
  rastrigin:
    dimensions: 10
    bounds:
      min: -5.12
      max: 5.12
    stopping_criteria:
    - type: max_iterations
      max_iterations: 2500
common_swarm:
  num_particles: 40
common_pso_params:
  topology: global
  initialization_strategy: random_uniform
  velocity_strategy: standard
  boundary_handler: clamping
  influence_strategy: single_best
  velocity_strategy_params:
    c1: 1.49445
    c2: 1.49445
common_run_config:
  num_runs: 1
  verbose: false
pso_variants:
  default: {}
  arxiv_2405_orthogonal_mutation:
    pso_params:
      velocity_strategy: orthogonal_mutation
      topology: random
      topology_params:
        k: 4
      influence_strategy: single_best
      velocity_strategy_params:
        mutation_probability: 0.2
        mutation_strength: 0.03
        mutation_axes: 4
