# Extended PSO variant matrix for parameter sweeps, boundary/initialization ablations,
# and topology-density studies.

problems_to_benchmark:
  sphere:
    dimensions: 20
    bounds:
      min: -100.0
      max: 100.0
    stopping_criteria:
    - {type: max_iterations, max_iterations: 2500}

  rastrigin:
    dimensions: 10
    bounds:
      min: -5.12
      max: 5.12
    stopping_criteria:
    - {type: max_iterations, max_iterations: 2500}

common_swarm:
  num_particles: 40

common_pso_params:
  topology: global
  initialization_strategy: random_uniform
  velocity_strategy: standard
  boundary_handler: clamping
  influence_strategy: single_best

  velocity_strategy_params:
    c1: 1.49445
    c2: 1.49445
common_run_config:
  num_runs: 3
  verbose: false

pso_variants:
  default: {}

  standard_global:
    pso_params:
      topology: global

  bounds_aware:
    pso_params:
      initialization_strategy: bounds_aware

  bounds_aware_ring:
    pso_params:
      initialization_strategy: bounds_aware
      topology: ring
      topology_params:
        k: 2

  random_sparse:
    pso_params:
      topology: random
      topology_params:
        k: 1
        rebuild_probability: 0.5

  ring_tight:
    pso_params:
      topology: ring
      topology_params:
        k: 1

  inertia_weight_fast:
    pso_params:
      velocity_strategy: inertia_weight
      velocity_strategy_params: {}
  constriction_fixed_chi:
    pso_params:
      velocity_strategy: constriction
      topology: global
      velocity_strategy_params:
        phi1: 2.8
        phi2: 2.8
        chi: 0.7
  qpso:
    pso_params:
      velocity_strategy: qpso
      velocity_strategy_params:
        beta: 1.0

  qpsp:
    pso_params:
      velocity_strategy: qpso
      topology: random
      topology_params:
        k: 3
        rebuild_probability: 0.8
      velocity_strategy_params:
        beta_min: 1.3
        beta_max: 2.2

  qpsb:
    pso_params:
      velocity_strategy: qpso
      topology: ring
      topology_params:
        k: 4
      velocity_strategy_params:
        beta: 1.8

  apso:
    pso_params:
      velocity_strategy: apso
      velocity_strategy_params:
        w_max: 0.95
        w_min: 0.35
        c1_max: 2.8
        c1_min: 0.3
        c2_max: 2.8
        c2_min: 0.3

  qpso_decay:
    pso_params:
      velocity_strategy: qpso
      velocity_strategy_params:
        beta_min: 1.2
        beta_max: 2.0

  apso_gbest:
    pso_params:
      velocity_strategy: apso
      topology: global
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_lbest:
    pso_params:
      velocity_strategy: apso
      topology: ring
      topology_params:
        k: 3
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_stable:
    pso_params:
      velocity_strategy: apso
      velocity_strategy_params:
        w_max: 0.8
        w_min: 0.4
        c1_max: 2.0
        c1_min: 0.7
        c2_max: 2.0
        c2_min: 0.7

  apso_aggressive:
    pso_params:
      velocity_strategy: apso
      topology: random
      topology_params:
        k: 4
        rebuild_probability: 0.8
      velocity_strategy_params:
        w_max: 1.0
        w_min: 0.2
        c1_max: 3.0
        c1_min: 0.2
        c2_max: 3.0
        c2_min: 0.2

  apso_global_sparse:
    pso_params:
      velocity_strategy: apso
      topology: global
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_global_dense:
    pso_params:
      velocity_strategy: apso
      topology: global
      velocity_strategy_params:
        w_max: 1.0
        w_min: 0.3
        c1_max: 3.0
        c1_min: 0.0
        c2_max: 3.0
        c2_min: 0.0

  apso_lbest_sparse:
    pso_params:
      velocity_strategy: apso
      topology: ring
      topology_params:
        k: 2
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_lbest_dense:
    pso_params:
      velocity_strategy: apso
      topology: ring
      topology_params:
        k: 8
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_random_sparse:
    pso_params:
      velocity_strategy: apso
      topology: random
      topology_params:
        k: 2
        rebuild_probability: 0.3
      velocity_strategy_params:
        w_max: 0.9
        w_min: 0.4
        c1_max: 2.5
        c1_min: 0.5
        c2_max: 2.5
        c2_min: 0.5

  apso_random_dense:
    pso_params:
      velocity_strategy: apso
      topology: random
      topology_params:
        k: 6
        rebuild_probability: 1.0
      velocity_strategy_params:
        w_max: 1.0
        w_min: 0.2
        c1_max: 3.0
        c1_min: 0.2
        c2_max: 3.0
        c2_min: 0.2

  fips_ring:
    pso_params:
      velocity_strategy: fips
      influence_strategy: fips
      topology: ring
      topology_params:
        k: 2
      velocity_strategy_params: {}
  bare_bones_random:
    pso_params:
      velocity_strategy: bare_bones
      topology: random
      topology_params:
        k: 3
      influence_strategy: single_best
      velocity_strategy_params:
        min_std: 1e-6
        use_abs_std: true


  arxiv_2405_orthogonal_learning:
    pso_params:
      topology: random
      topology_params:
        k: 2
        rebuild_probability: 0.75
      influence_strategy: orthogonal_learning
      velocity_strategy: standard
      influence_strategy_params:
        self_probability: 0.35
        neighbor_probability: 0.45

  arxiv_2405_orthogonal_mutation:
    pso_params:
      velocity_strategy: orthogonal_mutation
      topology: random
      topology_params:
        k: 4
      influence_strategy: single_best
      velocity_strategy_params:
        mutation_probability: 0.2
        mutation_strength: 0.03
        mutation_axes: 4

  arxiv_2503_de_hybrid:
    pso_params:
      velocity_strategy: de_hybrid
      topology: random
      topology_params:
        k: 3
        rebuild_probability: 0.9
      influence_strategy: single_best
      velocity_strategy_params:
        differential_weight: 0.7
        crossover_probability: 0.85
  clpso_ring:
    pso_params:
      velocity_strategy: clpso
      topology: ring
      topology_params:
        k: 2
      influence_strategy: single_best

  clpso_aggressive:
    pso_params:
      velocity_strategy: clpso
      topology: global
      influence_strategy: single_best
      velocity_strategy_params:
        c: 1.9
        w_start: 1.0
        w_end: 0.5
        refresh_gap: 5

  clpso_conservative:
    pso_params:
      velocity_strategy: clpso
      topology: random
      topology_params:
        k: 5
        rebuild_probability: 0.5
      influence_strategy: single_best
      velocity_strategy_params:
        c: 1.2
        w_start: 0.7
        w_end: 0.3
        refresh_gap: 10

  damped_reflection_no_clamp_reset:
    pso_params:
      boundary_handler: damped_reflection
      boundary_handler_params:
        damping_factor: -0.6

  clamping_no_reset:
    pso_params:
      boundary_handler: clamping
      boundary_handler_params:
        reset_velocity: false
