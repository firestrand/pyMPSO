# PSO Single Experiment Configuration (Sphere) - Using Benchmark Format

# Defines sets of problems to run (in this case, just one)
problems_to_benchmark:
  sphere:
    # Problem-specific settings override common settings if defined here
    dimensions: 10 # Single integer value
    bounds: {min: -100.0, max: 100.0}
    stopping_criteria:
    - {type: max_iterations, max_iterations: 5000}
    # Example override: uncomment to use different particles for sphere
    # swarm:
    #   num_particles: 50 

# Common PSO Settings (applied to all problems unless overridden)
common_swarm:
  num_particles: 30 # Valid integer value

common_pso_params:
  topology: global
  initialization_strategy: random_uniform
  velocity_strategy: standard
  boundary_handler: clamping

# Common Run Settings (applied to all benchmark tasks)
  velocity_strategy_params:
    c1: 1.49445
    c2: 1.49445
common_run_config:
  num_runs: 5 # Set to 1 for a single run
  # random_seed: 42 # Uncomment and set seed for reproducible single runs (num_runs=1)
  random_seed:
  verbose: false # Set to True for detailed output
